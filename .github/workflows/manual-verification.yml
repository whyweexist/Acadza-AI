name: Manual Verification (opt-in only)
on:
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/triage/requirements.txt
      - run: python scripts/validate_results.py
      - run: cd services/triage && pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd apps/web && npm install && npm run typecheck && npm run build
